<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BRAVER — Not fearless. Just braver.</title>
    <meta name="description" content="BRAVER aide les jeunes à trier ce qui les inquiète en trois zones : questionner une pensée, agir, ou accepter. En français et en darija." />
    <meta name="theme-color" content="#2B1B4A" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#view">Aller au contenu</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="BRAVER, accueil">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="5" width="24" height="6" rx="3" fill="var(--scen)"/><rect x="4" y="13" width="18" height="6" rx="3" fill="var(--act)"/><rect x="4" y="21" width="12" height="6" rx="3" fill="var(--acc)"/></svg>
          <span>BRAVER</span>
        </a>
        <nav class="tabs" aria-label="Navigation principale">
          <a href="#/" data-nav="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7" /></svg><span>Vide ta tête</span></a>
          <a href="#/tri" data-nav="tri">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span>Le tri</span></a>
          <a href="#/replay" data-nav="replay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg><span>Mon Replay</span></a>
          <a href="#/plus" data-nav="plus">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Plus</span></a>
        </nav>
        <div class="top-actions">
          <div class="tone" role="group" aria-label="Ton de BRAVER">
            <button type="button" data-action="mode" data-mode="doux">Doux</button>
            <button type="button" data-action="mode" data-mode="direct">Direct</button>
          </div>
          <a class="help-btn" href="#/aide" data-action="help">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
            <span>Besoin d'aide maintenant</span>
          </a>
        </div>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="enginebar">
      <div class="enginebar-inner">
        <span class="engine"><span class="engine-dot" id="engine-dot"></span><span id="engine-text">Vérification du moteur…</span></span>
        <label class="force"><input type="checkbox" id="force-local" /> Passer en règles locales</label>
        <span class="tagline">Not fearless. Just braver.</span>
      </div>
    </footer>

    <div id="sorting" class="sorting" hidden aria-live="polite">
      <div class="sorting-box">
        <div class="sorting-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
        <p id="sorting-text">BRAVER trie tes inquiétudes…</p>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript><p style="padding:24px">BRAVER a besoin de JavaScript pour fonctionner.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>

name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax check every JS file
        run: |
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || exit 1; done
      - name: Tests (if present)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm test; else echo "no tests yet"; fi
      - name: No API keys in the code
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}|sk-ant-[A-Za-z0-9_-]{10,}|eyJhbGciOi[0-9A-Za-z_-]{40,}' -- ':!*.md'; then echo "Key found"; exit 1; fi
